# Builds the API and web images and pushes them to Docker Hub.
#   push to master -> :latest and :sha-<short>
#   tag v1.2.3     -> :1.2.3, :1.2 and :latest
#   pull request   -> build only (no push), so broken Dockerfiles are caught before merge
# Repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Docker Hub -> Account settings -> Personal access tokens, Read & Write)
name: Docker images

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
    paths:
      - "backend/frs/**"
      - "frontend/frs_react/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "backend/frs/**"
      - "frontend/frs_react/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frs-api
            context: backend/frs
          - name: frs-web
            context: frontend/frs_react
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - name: Update Docker Hub description
        if: env.PUSH == 'true' && github.ref == 'refs/heads/master'
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}
          readme-filepath: docs/docker.md
          short-description: "Face login with on-device embeddings (${{ matrix.name }})"
