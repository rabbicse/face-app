# Full stack on one machine:  docker compose up -d   ->  http://localhost:3000
#
# Set FRS_IMAGE_NAMESPACE (see .env.example) to run the published Docker Hub images; without it the
# images are built from this repo on the first run. Rebuild with:  docker compose up -d --build
name: frs

services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.20.0}
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    # not published: only the API talks to it. Uncomment to use the dashboard at :6333/dashboard
    # ports: ["127.0.0.1:6333:6333"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: ${FRS_IMAGE_NAMESPACE:+${FRS_IMAGE_NAMESPACE}/}frs-api:${FRS_TAG:-latest}
    build: ./backend/frs
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      FRS_WORKERS: ${FRS_WORKERS:-2}
      FRS_MATCH_THRESHOLD: ${FRS_MATCH_THRESHOLD:-0.45}
      FRS_MATCH_MARGIN: ${FRS_MATCH_MARGIN:-0.05}
      # the browser reaches the API through the web container (same origin)
      FRS_CORS_ORIGINS: ${FRS_CORS_ORIGINS:-http://localhost:3000}
    # published only for the mobile app / scripts; remove if you only use the web app
    ports:
      - "${FRS_API_PORT:-5000}:8000"

  web:
    image: ${FRS_IMAGE_NAMESPACE:+${FRS_IMAGE_NAMESPACE}/}frs-web:${FRS_TAG:-latest}
    build: ./frontend/frs_react
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRS_WEB_PORT:-3000}:3000"

volumes:
  qdrant_data:
